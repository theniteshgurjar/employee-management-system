version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  postgres-db:
    image: postgres:16-alpine
    container_name: ems-postgres
    restart: always
    environment:
      POSTGRES_DB: ems_db
      POSTGRES_USER: ems_admin
      POSTGRES_PASSWORD: ems_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems_admin -d ems_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ems-network

  # ==========================================
  # Spring Boot Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems-backend
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/ems_db
      SPRING_DATASOURCE_USERNAME: ems_admin
      SPRING_DATASOURCE_PASSWORD: ems_secure_password_2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    networks:
      - ems-network

  # ==========================================
  # React Frontend Service
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ems-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - ems-network

volumes:
  postgres-data:
    driver: local

networks:
  ems-network:
    driver: bridge
